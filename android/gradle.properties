# --enable-native-access: Gradle's own native-platform library calls
# System::load, which JDK 24+ restricts (JEP 472) and warns about on every
# build. Granting it to the unnamed module silences that and keeps the
# build working when the JDK starts denying it outright.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# Jetifier rewrites legacy android.support.* references, but nothing in this
# project's runtime classpath resolves from com.android.support any more, and
# its transform runs out of heap on the Flutter engine JARs.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
