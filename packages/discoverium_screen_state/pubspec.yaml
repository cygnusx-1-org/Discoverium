name: discoverium_screen_state
description: Reports whether the device is locked, so background updates can wait until the phone is idle.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: org.cygnusx1.discoverium.screenstate
        pluginClass: ScreenStatePlugin
